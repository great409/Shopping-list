<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Street - Clothes</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f4f4f4;color:#111}
  header{background:#000;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  header h1{font-size:22px;margin:0}
  header h1 span{color:#ffcc00}
  header button{background:#ffcc00;border:0;padding:10px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
  .hero{background:#000;color:#fff;padding:32px 20px;text-align:center}
  .hero h2{margin:0 0 8px;font-size:24px}
  .hero h2 span{color:#ffcc00}
  .hero a{display:inline-block;margin-top:14px;background:#ffcc00;color:#000;padding:11px 18px;border-radius:25px;text-decoration:none;font-weight:bold}
  .cat{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
  .cat button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer}
  .cat button.active{background:#000;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 16px 100px}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:center;padding-bottom:12px}
  .card img{width:100%;height:180px;object-fit:cover}
  .card h3{font-size:14px;margin:10px 8px 4px}
  .price{font-weight:bold;margin:4px}
  .old{color:#999;text-decoration:line-through;font-size:12px}
  .card button{background:#000;color:#fff;border:0;padding:9px 14px;border-radius:20px;cursor:pointer;margin-top:6px}
  #cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:20}
  #cart button{background:#ffcc00;color:#000;border:0;padding:11px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;padding:16px;z-index:30}
  .modal-content{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:18px;max-height:90vh;overflow:auto}
  input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
</style>
</head>
<body>

<header>
  <h1>SHOP <span>STREET</span></h1>
  <button onclick="viewCart()">Cart (<span id="count">0</span>)</button>
</header>

<div class="hero">
  <h2>SHOP <span>STREET</span> - Wear The Culture</h2>
  <p>Quality Clothes For Men & Women | Delivery Nationwide</p>
  <a href="#products">Shop Now</a>
</div>

<div class="cat">
  <button class="active" onclick="filterCat('all',this)">All</button>
  <button onclick="filterCat('Shirts',this)">Shirts</button>
  <button onclick="filterCat('Hoodies',this)">Hoodies</button>
  <button onclick="filterCat('Jeans',this)">Jeans</button>
  <button onclick="filterCat('Dresses',this)">Dresses</button>
</div>

<div class="grid" id="products"></div>

<div id="cart">
  <div><b>Total: N<span id="total">0</span></b><br><small id="items">0 items</small></div>
  <button onclick="viewCart()">Checkout</button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <h3>Your Cart - Shop Street</h3>
    <div id="cartItems"></div>
    <p><b>Total: N<span id="modalTotal">0</span></b></p>
    <input id="custName" placeholder="Your Name">
    <input id="custAddress" placeholder="Delivery Address e.g. Jos, Plateau">
    <button onclick="checkout()" style="background:#25D366;color:#fff;border:0;padding:12px;border-radius:12px;width:100%;font-weight:bold">Order via WhatsApp</button>
    <button onclick="closeCart()" style="margin-top:8px;width:100%;padding:10px;border-radius:12px">Close</button>
  </div>
</div>

<script>
const products = [
  {id:1, name:"Classic White Shirt", cat:"Shirts", price:12000, old:15000, img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"},
  {id:2, name:"Black Oversized Hoodie", cat:"Hoodies", price:18000, old:22000, img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600"},
  {id:3, name:"Blue Denim Jeans", cat:"Jeans", price:16500, old:20000, img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=600"},
  {id:4, name:"Floral Summer Dress", cat:"Dresses", price:15500, old:19000, img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600"},
  {id:5, name:"Check Shirt - Men", cat:"Shirts", price:13500, old:16000, img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600"},
  {id:6, name:"Grey Hoodie", cat:"Hoodies", price:19500, old:24000, img:"https://images.unsplash.com/photo-1578681994506-b8f463449011?w=600"},
];
let cart = [];
let currentCat = 'all';

function render(){
  const grid = document.getElementById('products');
  grid.innerHTML = '';
  products.filter(p=> currentCat==='all' || p.cat===currentCat).forEach(p=>{
    grid.innerHTML += `<div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div class="price">N${p.price.toLocaleString()} <span class="old">N${p.old.toLocaleString()}</span></div>
      <small>${p.cat}</small><br>
      <button onclick="addToCart(${p.id})">Add to Cart</button>
    </div>`;
  });
}

function filterCat(cat,btn){
  currentCat = cat;
  document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function addToCart(id){
  const item = products.find(p=>p.id===id);
  cart.push(item);
  updateCart();
  alert(item.name + " added");
}

function updateCart(){
  const total = cart.reduce((s,i)=>s+i.price,0);
  document.getElementById('count').innerText = cart.length;
  document.getElementById('total').innerText = total.toLocaleString();
  document.getElementById('items').innerText = cart.length + " items";
  document.getElementById('modalTotal').innerText = total.toLocaleString();
  document.getElementById('cartItems').innerHTML = cart.map((i,idx)=>`<p>${i.name} - N${i.price.toLocaleString()} <span onclick="removeItem(${idx})" style="color:red;cursor:pointer">X</span></p>`).join('') || "<p>Cart is empty</p>";
}

function removeItem(idx){ cart.splice(idx,1); updateCart(); }
function viewCart(){ document.getElementById('cartModal').style.display='flex'; }
function closeCart(){ document.getElementById('cartModal').style.display='none'; }

function checkout(){
  if(cart.length===0){ alert("Cart empty"); return; }
  const name = document.getElementById('custName').value || "Customer";
  const addr = document.getElementById('custAddress').value || "No address";
  let msg = `Hello SHOP STREET, I want to order:%0A`;
  cart.forEach(i=>{ msg += `- ${i.name} - N${i.price}%0A`; });
  const total = cart.reduce((s,i)=>s+i.price,0);
  msg += `Total: N${total}%0AName: ${name}%0AAddress: ${addr}`;
  window.open(`https://wa.me/2349045071692?text=${msg}`, '_blank');
}
render();
</script>
</body>
</html>
